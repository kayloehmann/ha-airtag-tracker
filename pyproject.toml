[project]
name = "ha-airtag-tracker"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
dependencies = [
  "FindMy==0.10.2",
  "homeassistant>=2026.9.0,<2026.10.0"
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
